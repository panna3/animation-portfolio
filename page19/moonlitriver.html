      const u = Math.min(1, (tr - END_FROM) / END_DUR), a = v0 * END_DUR, R = 1 - s0;

    const alpha = Math.min(1, k / 0.08);                    // fades in out of the light instead of popping up

    // 跳ぶ直前に、ぐっと沈み込む（ため）

    const d = dogState();
    // ripples only once it is on the water
    if (running && d.visible && d.scale > 0.4 && t > nextRipple) { ripples.push({ x: d.x, y: d.y + 10 * d.scale, s: d.scale, age: 0 }); nextRipple = t + (d.resting ? 2.4 : 0.9); }
    ctx.globalCompositeOperation = 'source-over';
    for (const rp of ripples) {
      if (running) rp.age += dt;
      if (rp.age < 0) continue;                // a delayed ring that hasn't started yet
      const k = Math.min(1, rp.age / 3);
      const rx = (60 + 70 * k) * rp.s;
      ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - k)})`; ctx.lineWidth = 2.2 * (1 - k) + 0.6;
      ctx.beginPath(); ctx.ellipse(rp.x, rp.y, rx, rx * 0.32, 0, 0, 7); ctx.stroke();
    }
    ripples = ripples.filter(r => r.age < 3);
    // the river swells up into a little mound under the boat just as a jump throws it up, then sinks back
    if (MOUND_ON) JUMPS.forEach(([at, dur, height], i) => {
      const tau = d.tr - at, f = Math.sqrt(height / 120);
      if (tau < -0.25 || tau > 0.75) return;
      if (tau < 0.02 || !bulgeAt[i]) bulgeAt[i] = { x: d.x, y: d.wy, s: d.scale };
      const A = tau < 0.05 ? Math.sin(Math.PI / 2 * (tau + 0.25) / 0.3) : Math.pow(1 - (tau - 0.05) / 0.7, 2);
      if (A <= 0.01) return;
      const { x, y, s } = bulgeAt[i], base = y + 8 * s, rx = ((55 + 12 * A) * f + 22) * s, hgt = (58 * f + 8) * s * A;
      ctx.save();
      const g = ctx.createLinearGradient(0, base - hgt, 0, base);
      g.addColorStop(0, `rgba(235,250,255,${0.97 * A})`);
      g.addColorStop(0.35, `rgba(130,205,236,${0.92 * A})`);
      g.addColorStop(0.8, `rgba(105,188,226,${0.7 * A})`);
      g.addColorStop(1, 'rgba(105,188,226,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x - rx, base);
      ctx.bezierCurveTo(x - rx * 0.45, base, x - rx * 0.4, base - hgt, x, base - hgt);
      ctx.bezierCurveTo(x + rx * 0.4, base - hgt, x + rx * 0.45, base, x + rx, base);
      ctx.ellipse(x, base, rx, rx * 0.22, 0, 0, Math.PI);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${0.8 * A})`; ctx.lineWidth = 1.6 * s + 0.5;   // a bright line along the top of the swell
      ctx.beginPath();
      ctx.moveTo(x - rx * 0.55, base - hgt * 0.55);
      ctx.bezierCurveTo(x - rx * 0.3, base - hgt * 1.0, x + rx * 0.3, base - hgt * 1.0, x + rx * 0.55, base - hgt * 0.55);
      ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${0.9 * A})`;          // a few foam bubbles on top
      for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.arc(x + k * rx * 0.17, base - hgt * (0.92 - Math.abs(k) * 0.12), (2.6 - Math.abs(k) * 0.5) * s + 0.6, 0, 7); ctx.fill(); }
      ctx.restore();
    });
    if (d.visible) {
      // the boat's bottom rides on the water line; it turns around its own middle when flipping
      ctx.save(); ctx.globalAlpha = d.alpha;
      ctx.translate(d.x, d.y); ctx.rotate(d.rock);              // rocks around the bottom of the boat
      ctx.translate(0, -dog.height * 0.22 * d.scale);
      ctx.rotate(d.tilt + d.spin); ctx.scale(d.scale, d.scale);
      drawCrew(sp, d);
      ctx.restore();
    }

    // water droplets: fly up, then fall back with gravity
    for (const w of drops) {
      if (running) { w.age += dt; w.vy += 620 * dt * Math.max(d.scale, 0.45); w.x += w.vx * dt; w.y += w.vy * dt; }
      const a = Math.max(0, 1 - w.age / w.life);
      ctx.fillStyle = `rgba(235,250,255,${0.95 * a})`;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(150,215,240,${0.35 * a})`;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 1.8, 0, 7); ctx.fill();
    }
    drops = drops.filter(w => w.age < w.life);

    // 6. Little golden sparkles pop around the dog as it floats (and burst out when it twirls)
    ctx.globalCompositeOperation = 'screen';
    if (running && d.jumping && jumpState[d.jumpIdx] === 0) {   // takeoff: a spout of water throws the boat up
      jumpState[d.jumpIdx] = 1;
      const f = Math.max(0.25, JUMPS[d.jumpIdx][2] / 120);   // smaller hops kick up less water
      ripples.push({ x: d.x, y: d.y + 10 * d.scale, s: d.scale * 0.9, age: 0 });
      splash(d.x, d.y + 6 * d.scale, d.scale, Math.round(34 * f), 260 * Math.sqrt(f), 0.35);
    }
    CURVE_SPLASHES.forEach(([from, to, side]) => {
      const u = (t - dogStart - from) / (to - from);
      if (!running || u < 0 || u > 1) return;
      // white sparkles stream out sideways from under the moon boat, to the outside only, all through the bend
      const env = Math.sin(Math.PI * u) ** 0.5, s = d.scale;
      sprayAcc += 38 * env * dt;
      while (sprayAcc >= 1) {
        sprayAcc -= 1;
        pops.push({ x: d.x + side * rnd(8, 26) * s, y: d.y + rnd(2, 10) * s,
                    vx: side * rnd(60, 140) * s * (0.6 + 0.4 * env), vy: -rnd(8, 40) * s, age: 0, life: rnd(0.6, 1.0), r: rnd(4, 8) });
      }
    });
    const landed = jumpState.findIndex((st, i) => st === 1 && !(d.jumping && d.jumpIdx === i));
    if (running && landed >= 0) {                            // splashdown: water flies out, rings and sparkles
      jumpState[landed] = 2;
      const f = Math.max(0.25, JUMPS[landed][2] / 120), n = Math.round(18 * f);
      splash(d.x, d.y + 6 * d.scale, d.scale, Math.round(30 * f), 170 * Math.sqrt(f), 1.1);
      for (let i = 0; i < (f < 0.5 ? 1 : 3); i++) ripples.push({ x: d.x, y: d.y + 10 * d.scale, s: d.scale * (1 + i * 0.35), age: -i * 0.18 });
      for (let i = 0; i < n; i++) {
        const an = (i / n) * Math.PI * 2, rr = rnd(50, 90) * d.scale;
        pops.push({ x: d.x + Math.cos(an) * rr, y: d.y - 10 * d.scale + Math.sin(an) * rr * 0.45, vy: rnd(-40, -15), age: 0, life: rnd(0.9, 1.6), r: rnd(6, 11) });
      }
    }
    if (running && d.visible && d.scale > 0.45 && t > nextPop) { for (let i = 0; i < 5; i++) pops.push({ x: d.x + rnd(-34, 34) * d.scale, y: d.y + (-30 + rnd(-30, 8)) * d.scale, vy: rnd(-22, -10), age: 0, life: rnd(0.9, 1.5), r: rnd(4, 8) }); nextPop = t + rnd(2.5, 4); }
    for (const p of pops) {
      if (running) { p.age += dt; p.y += p.vy * dt; p.x += (p.vx || 0) * dt; }
      const s = Math.sin(Math.PI * Math.min(1, p.age / p.life));
      star(p.x, p.y, p.r * s, s, t, '255,252,230', p.vx ? '205,238,255' : '255,215,120');   // sideways spray is white-blue
    }
    pops = pops.filter(p => p.age < p.life);

    // 6b. Hearts float up above the two once they come to rest
    ctx.globalCompositeOperation = 'source-over';
    if (running && t - dogStart > (heartCount < 6 ? PUP_HOPS[0] : DOG_TURN_AT - 0.2) && heartCount < HEART_MAX && t > nextHeart) {
      const s = d.scale;
      // taking turns: one from above the big dog's head, the next from above the pup's (it sits lower, to the right)
      const fromPup = heartCount % 2 === 0;
      // (x, y are kept relative to the boat, so the hearts travel along with it)
      hearts.push({ x: (fromPup ? 25 : -28) * s + rnd(-9, 9) * s, y: -(fromPup ? 55 : 85) * s, vy: -rnd(26, 38) * s, ph: rnd(0, 6.3), size: rnd(11, 17) * s, age: 0, life: rnd(2.4, 3.2) });
      heartCount++;
      nextHeart = t + (heartCount % 6 < 4 ? 0.45 : 0.8);
    }
    for (const h of hearts) {
      if (running) { h.age += dt; h.y += h.vy * dt; }
      const k = h.age / h.life;
      const a = Math.min(1, k / 0.15) * Math.min(1, (1 - k) / 0.35);
      heart(d.x + h.x + Math.sin(h.age * 2.4 + h.ph) * 7, d.y + h.y, h.size * (0.7 + 0.3 * Math.min(1, k / 0.15)), a, Math.sin(h.age * 2 + h.ph) * 0.18);
    }
    hearts = hearts.filter(h => h.age < h.life);
    ctx.globalCompositeOperation = 'screen';

    // 7. Fireflies float upward over the whole scene
    for (const f of dust) {
      if (running) { f.y -= f.v * dt; f.x += Math.sin(t * 0.7 + f.ph) * 8 * dt; if (f.y < -10) { f.y = H + 10; f.x = rnd(0, W); } }
      dot(f.x, f.y, f.r, 0.55 + 0.45 * Math.sin(t * 2.2 + f.ph), '255,250,205');
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(n => frame(n, art));
  }

  const btn = document.getElementById('toggle');
  btn.addEventListener('click', () => { running = !running; btn.textContent = running ? '一時停止' : '再生'; });
  document.getElementById('replay').addEventListener('click', () => { dogStart = t + 0.3; pops = []; drops = []; hearts = []; heartCount = 0; nextHeart = 0; jumpState = JUMPS.map(() => 0); bulgeAt = JUMPS.map(() => null); splashFired = new Set(); if (!running) { running = true; btn.textContent = '一時停止'; } });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { running = false; btn.textContent = '再生'; }
  // the two Pomeranians (1-year-old cream, 3-month-old apricot) in a crescent-moon boat, as separate pieces
  const SPIN_FILES = ['spin_boat', 'spin_rim', 'spin_big_front', 'spin_big_side', 'spin_big_back', 'spin_pup_front', 'spin_pup_side', 'spin_pup_back'];
  Promise.all([load('bg.png'), load('moon_glow.png'), load('haze.png'), load('moon_mask.png'), ...SPIN_FILES.map(f => load(f + '.png'))])
    .then(([bg, glow, haze, moonMask, boat, rim, bf, bs, bb, pf, ps, pb]) => {
      const sp = { boat, rim, big: { front: bf, side: bs, back: bb }, pup: { front: pf, side: ps, back: pb } };
      requestAnimationFrame(n => frame(n, { bg, sp, glow, haze, moonMask }));
    });
})();
</script>
